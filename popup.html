<!doctype html>
<html lang="es">
<meta charset="utf-8">
<style>
  :root {
    --bg: #fff; --fg: #18181b; --muted: #6b7280; --line: #e5e7eb; --hover: #f4f4f5;
    --accent: #2563eb; --accent-soft: #eff6ff; --warn: #b45309; --warn-soft: #fffbeb; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --hover: #27272a;
      --accent: #60a5fa; --accent-soft: #1e293b; --warn: #fbbf24; --warn-soft: #292211; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: progress; opacity: .6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { margin-bottom: 12px; }
  #tab { font-size: 14px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { color: var(--muted); font-size: 12px; }

  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .devhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 16px 0 6px; }
  .devhead h2 { margin: 0; }
  .switch { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .switch input { accent-color: var(--accent); margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; }

  .dev { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
  .dev.on { border-color: var(--accent); background: var(--accent-soft); }
  .dev.warn { border-color: var(--warn); background: var(--warn-soft); }
  .pick { flex: 1; display: flex; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border: 0; background: none; min-width: 0; }
  .pick:hover:not(:disabled) { background: var(--hover); }
  .ico { font-size: 18px; width: 22px; text-align: center; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { display: block; color: var(--muted); font-size: 11px; }
  .dev.warn small { color: var(--warn); }
  .check { color: var(--accent); font-weight: 700; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; }
  .multi .check { border: 1.5px solid var(--line); }
  .multi .on .check { border-color: var(--accent); background: var(--accent); color: var(--bg); }
  .test { border: 0; border-left: 1px solid var(--line); background: none; padding: 0 12px; color: var(--muted); }
  .test:hover { background: var(--hover); color: var(--fg); }

  #fx { display: none; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .fxrow { display: grid; grid-template-columns: 62px 1fr 52px; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fxrow input[type=range] { width: 100%; accent-color: var(--accent); }
  .fxrow output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .boost { color: var(--warn) !important; }
  .fxfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 12px; }
  .fxfoot label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .fxfoot input { accent-color: var(--accent); margin: 0; }
  .link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; }

  #status { min-height: 1.4em; margin-top: 8px; font-size: 12px; color: var(--muted); }
  #status.err { color: var(--err); }

  #perm { display: none; padding: 10px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 8px; margin-bottom: 12px; }
  #perm button { margin-top: 6px; width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--warn); background: none; }

  #others li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
  #others li:first-child { border-top: 0; }
  #others .warnTxt { color: var(--warn); }
  .mini { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 3px 8px; }
  .mini:hover { background: var(--hover); }
  .empty { color: var(--muted); font-size: 12px; }

  footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 8px; }
  footer .row { display: flex; align-items: center; gap: 8px; }
  footer select { flex: 1; padding: 3px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--fg); }
</style>

<div id="perm">Para ver los nombres de tus audífonos y bocinas hace falta un permiso, una sola vez.
  <button id="grant">Dar permiso</button></div>

<header>
  <h1 id="tab">…</h1>
  <div id="hint"></div>
</header>

<div class="devhead">
  <h2 id="devh">¿Dónde suena esta pestaña?</h2>
  <label class="switch"><input type="checkbox" id="multi"> Varias a la vez</label>
</div>
<ul id="devices" aria-labelledby="devh"></ul>

<div id="fx">
  <div class="fxrow">
    <label for="vol">Volumen</label>
    <input id="vol" type="range" min="0" max="200" step="5" value="100" list="vticks">
    <output id="volval" for="vol">100%</output>
  </div>
  <datalist id="vticks"><option value="100"></option></datalist>
  <div class="fxrow">
    <label for="pan">Balance</label>
    <input id="pan" type="range" min="-100" max="100" step="5" value="0" list="pticks">
    <output id="panval" for="pan">Centro</output>
  </div>
  <datalist id="pticks"><option value="0"></option></datalist>
  <div class="fxfoot">
    <label><input type="checkbox" id="mono"> Mono</label>
    <button class="link" id="fxreset">Restablecer</button>
  </div>
</div>

<div id="status" role="status" aria-live="polite"></div>

<h2>Otras pestañas enrutadas</h2>
<ul id="others"></ul>

<footer>
  <div class="row">
    <label for="onLost">Si se desconecta:</label>
    <select id="onLost">
      <option value="default">Seguir en predeterminado</option>
      <option value="mute">Silenciar</option>
    </select>
  </div>
  <div class="row"><span id="keyhint"></span></div>
</footer>

<script type="module" src="popup.js"></script>
</html>
